<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSSE課題</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="bg-green-400 text-white">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3 px-6 py-4">
            <h1 class="text-xl font-bold">姫路東高等学校</h1>
            <nav class="flex flex-wrap justify-center gap-4 text-sm">
                <a href="#" class="hover:text-green-200 transition">ホーム</a>
                <a href="#" class="hover:text-green-200 transition">授業</a>
                <a href="#" class="hover:text-green-200 transition">学生生活</a>
                <a href="#" class="hover:text-green-200 transition">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-6 px-6 py-8">
        <section class="mb-8 bg-green-100 p-6 rounded-lg">
            <h2 class="text-2xl font-bold mb-4">学校紹介</h2>
            <p>姫路東高等学校は、学問とスポーツの両立を目指す学生たちのための学校です。最新の設備と充実したカリキュラムで、学生一人ひとりの成長をサポートします。</p>
        </section>

        <section class="mb-8 bg-green-100 p-6 rounded-lg">
            <h2 class="text-2xl font-bold mb-4">授業内容</h2>
            <p>本校では、理系・文系問わず幅広い分野の授業を提供しています。専門的な知識を深めることができるだけでなく、実践的なスキルも身につけることができます。</p>
        </section>

        <section class="mb-8 bg-green-100 p-6 rounded-lg">
            <h2 class="text-2xl font-bold mb-4">学生生活</h2>
            <p>クラブ活動やイベントが盛んで、学生同士の交流も活発です。多様なバックグラウンドを持つ仲間たちと共に、充実した学生生活を送ることができます。</p>
        </section>
    </main>

    <footer class="bg-green-400 text-white py-4">
        <div class="max-w-5xl mx-auto text-center">&copy; 2026 姫路東高等学校</div>
    </footer>
</body>
